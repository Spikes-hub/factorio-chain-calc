body:
  - type: markdown
    attributes:
      value: |
        Something does not work? Tell us what happened. A reproducible case helps most.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Windows, browser, Factorio version, main mods
  - type: textarea
    id: log
    attributes:
      label: Error text, screenshot, or the recipe/machine you were using
      render: text
